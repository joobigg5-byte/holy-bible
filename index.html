  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            reg.addEventListener('updatefound', () => {
              const incoming = reg.installing;
              if (!incoming) return;
              incoming.addEventListener('statechange', () => {
                if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
                  incoming.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (refreshing) return;
              refreshing = true;
              window.location.reload();
            });
          } catch (err) {
            console.warn('Service worker registration failed:', err);
          }
        });
      }
    </script>

    <!-- WITTYHUB SUPPORT LINK (AUTO-ADAPTING TO THEME) -->
    <script>
      (function () {
        var APP = 'Holy Bible';
        var VERSION = '1.0';
        var SUPPORT = 'https://wittyhub.co';

        var url = SUPPORT + '?app=' + encodeURIComponent(APP) + '&v=' + encodeURIComponent(VERSION);

        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:999999;display:flex;align-items:center;gap:8px;font:12px/1 sans-serif;pointer-events:none;';

        var ver = document.createElement('span');
        ver.textContent = 'v' + VERSION;
        ver.style.cssText = 'opacity:.75;color:#8a93a3;';

        var link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'Support';
        // Default Light Mode
        link.style.cssText = 'pointer-events:auto;text-decoration:none;color:#3d4654;background:rgba(255,255,255,.92);border:1px solid #d7dbe2;border-radius:6px;padding:6px 11px;';

        // Auto-detect dark theme and adapt
        setTimeout(function () {
          try {
            var bg = getComputedStyle(document.body).backgroundColor;
            var m = (bg.match(/[\d.]+/g) || []).map(Number);
            if (m.length < 3) return;
            var lum = (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255;
            if (lum < 0.4) {
              link.style.background = 'rgba(20,24,31,.86)';
              link.style.borderColor = '#39414f';
              link.style.color = '#d3d8e0';
            }
          } catch (e) {}
        }, 60);

        link.onmouseenter = function () { link.style.borderColor = '#1f4fd8'; link.style.color = '#1f4fd8'; };
        link.onmouseleave = function () {
          var bg = getComputedStyle(document.body).backgroundColor;
          var m = (bg.match(/[\d.]+/g) || []).map(Number);
          if (m.length < 3) return;
          var lum = (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255;
          if (lum < 0.4) {
            link.style.borderColor = '#39414f';
            link.style.color = '#d3d8e0';
          } else {
            link.style.borderColor = '#d7dbe2';
            link.style.color = '#3d4654';
          }
        };

        bar.appendChild(ver);
        bar.appendChild(link);
        document.body.appendChild(bar);
      })();
    </script>
  </body>
