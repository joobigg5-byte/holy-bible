  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker and reload once a new version takes over,
      // so readers aren't stranded on a stale build after you deploy.
      // Only run the service worker on the real site. On a dev server it
      // caches source modules and you end up debugging a stale copy of your
      // own app — which is exactly what happened during development.
      var isDev =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        location.hostname.endsWith('.local');

      if (isDev && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      }

      if (!isDev && 'serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');

            reg.addEventListener('updatefound', () => {
              const incoming = reg.installing;
              if (!incoming) return;
              incoming.addEventListener('statechange', () => {
                // A new worker is waiting and an old one is in control
                if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
                  incoming.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (refreshing) return;
              refreshing = true;
              window.location.reload();
            });
          } catch (err) {
            console.warn('Service worker registration failed:', err);
          }
        });
      }
    </script>
  </body>
